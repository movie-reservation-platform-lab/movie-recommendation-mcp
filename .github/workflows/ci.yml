name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.3"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --frozen

      - name: Compile Python sources
        run: uv run --frozen --no-sync python -m compileall src tests automation

      - name: Lint
        run: uv run --frozen --no-sync ruff check .

      - name: Check formatting
        run: uv run --frozen --no-sync ruff format --check .

  contract-tests:
    name: contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.3"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run contract tests
        run: uv run --frozen --no-sync pytest tests

  automation-tests:
    name: repository automation tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.3"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run repository automation tests
        run: uv run --frozen --no-sync pytest automation/tests

  container-smoke:
    name: production container smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Build production image
        run: docker build --tag movie-recommendation-mcp:smoke .

      - name: Start task-local downstream stub
        run: python3 automation/downstream_stub.py &

      - name: Start production container
        run: docker run --detach --name movie-recommendation-mcp --network host movie-recommendation-mcp:smoke

      - name: Verify health, MCP route, and runtime user
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8092/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs movie-recommendation-mcp
              exit 1
            fi
            sleep 1
          done

          mcp_status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8092/mcp)"
          test "$mcp_status" != "000"
          test "$mcp_status" != "404"
          test "$(docker exec movie-recommendation-mcp id -u)" != "0"

      - name: Stop production container
        if: always()
        run: docker stop movie-recommendation-mcp || true

  container-security-check:
    name: container-security-check
    if: github.event_name != 'push' || github.ref != 'refs/heads/main' || github.repository != 'movie-reservation-platform-lab/movie-recommendation-mcp'
    needs:
      - quality
      - automation-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check out reviewed shared security tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: movie-reservation-platform-lab/movie-platform-actions
          ref: 036531133bcefd454b5afc0eb55f8ba0328901ea
          path: .platform-actions
          persist-credentials: false

      - name: Set up Node.js for shared security tooling
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Build production image for vulnerability check
        run: docker build --platform linux/amd64 --target prod --tag movie-recommendation-mcp:pr-security .

      - name: Evaluate complete report with current approved policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node .platform-actions/local-tools/container-security/lib/scan.mjs \
            movie-recommendation-mcp:pr-security \
            --evidence-version v1alpha3 --component recommendation-mcp \
            --output-dir "$RUNNER_TEMP/recommendation-mcp-pr-security"

      - name: Retain PR vulnerability diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recommendation-mcp-pr-vulnerability-report-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recommendation-mcp-pr-security/
          if-no-files-found: error
          retention-days: 14

  publish-image:
    name: publish immutable GHCR image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'movie-reservation-platform-lab/movie-recommendation-mcp'
    needs:
      - quality
      - contract-tests
      - automation-tests
      - container-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Set up Node.js for shared evidence tooling
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Prepare canonical candidate
        id: candidate
        uses: movie-reservation-platform-lab/movie-platform-actions/actions/prepare-container-candidate@036531133bcefd454b5afc0eb55f8ba0328901ea # shared evidence v1alpha3
        with:
          component: recommendation-mcp
          github-token: ${{ github.token }}

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish single-platform image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ steps.candidate.outputs.image_ref }}:${{ steps.candidate.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.candidate.outputs.tag }}

      - name: Attest and publish security evidence
        uses: movie-reservation-platform-lab/movie-platform-actions/actions/container-evidence@036531133bcefd454b5afc0eb55f8ba0328901ea # shared evidence v1alpha3
        with:
          evidence-version: v1alpha3
          component: recommendation-mcp
          digest: ${{ steps.build.outputs.digest }}
          github-token: ${{ github.token }}
